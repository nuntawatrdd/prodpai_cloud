name: Terraform Deploy Infra

on:
  workflow_dispatch:

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Load config.env
        run: grep -v '^#' config.env | grep -v '^$' >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Dashboard App
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f dashboard/Dockerfile -t $ECR_REGISTRY/${{ env.DASHBOARD_ECR_REPOSITORY }}:$IMAGE_TAG -t $ECR_REGISTRY/${{ env.DASHBOARD_ECR_REPOSITORY }}:latest ./dashboard
          docker push $ECR_REGISTRY/${{ env.DASHBOARD_ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.DASHBOARD_ECR_REPOSITORY }}:latest

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Clean Terraform Cache
        run: rm -rf .terraform .terraform.lock.hcl

      - name: Terraform Init
        # โหลดค่า Bucket จาก config.env เข้าไปใน Backend
        run: terraform init -upgrade

      - name: Terraform Apply
        # บังคับใช้ latest เป็น default เพื่อให้เชื่อมกับ Image ล่าสุดที่ App Repo เพิ่งดันขึ้นมา
        run: terraform apply -auto-approve