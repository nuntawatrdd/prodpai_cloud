name: Patch & Rollout ASG

on:
  workflow_dispatch:

jobs:
  rollout-asg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Load config.env
        run: grep -v '^#' .github/config.env | grep -v '^$' >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollout ASG (Start Instance Refresh)
        run: |
          echo "Looking for ASG starting with: ${{ env.ASG_NAME_PREFIX }}..."
          
          # 1. ให้ AWS CLI ค้นหาชื่อ ASG เต็มๆ จาก Prefix
          REAL_ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, '${{ env.ASG_NAME_PREFIX }}')].AutoScalingGroupName" \
            --output text)

          # 2. เช็กว่าหาเจอไหม
          if [ -z "$REAL_ASG_NAME" ] || [ "$REAL_ASG_NAME" == "None" ]; then
            echo "Error: Could not find any ASG with prefix '${{ env.ASG_NAME_PREFIX }}'"
            exit 1
          fi

          echo "Found Target ASG: $REAL_ASG_NAME"
          echo "Starting ASG Instance Refresh..."

          # 3. สั่ง Refresh โดยใช้ชื่อเต็มที่หามาได้
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$REAL_ASG_NAME" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}'