name: Patch & Rollout ASG

on:
  workflow_dispatch:

jobs:
  rollout-asg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Load config.env
        run: grep -v '^#' .github/config.env | grep -v '^$' >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollout ASG (Manual Replacement)
        run: |
          echo "Looking for ASG starting with: ${{ env.ASG_NAME_PREFIX }}..."
          
          # 1. Find the ASG name
          REAL_ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, '${{ env.ASG_NAME_PREFIX }}')].AutoScalingGroupName" \
            --output text)

          if [ -z "$REAL_ASG_NAME" ] || [ "$REAL_ASG_NAME" == "None" ]; then
            echo "Error: Could not find any ASG with prefix '${{ env.ASG_NAME_PREFIX }}'"
            exit 1
          fi

          echo "Found Target ASG: $REAL_ASG_NAME"
          echo "Fetching attached instances..."

          # 2. Get all Instance IDs in the ASG
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$REAL_ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[*].InstanceId" \
            --output text)
          
          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" == "None" ]; then
            echo "No instances found in ASG to replace."
            exit 0
          fi
          
          # 3. Terminate instances sequentially to force replacement
          echo "Terminating instances: $INSTANCE_IDS"
          for INSTANCE in $INSTANCE_IDS; do
            echo "Terminating $INSTANCE..."
            aws autoscaling terminate-instance-in-auto-scaling-group \
              --instance-id "$INSTANCE" \
              --no-should-decrement-desired-capacity
            
            # Wait 30 seconds between terminations to allow the new instance to boot
            sleep 30 
          done