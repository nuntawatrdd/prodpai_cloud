# Nginx configuration for the Todo List static app.
# Runs as the unprivileged "nginx" user (uid 101) on port 8080, so the PID
# file and all temp paths live under /tmp, which that user can write.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 1k;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 512;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Security headers (inherited by every location below that does not
        # define its own add_header).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        # Health check for Docker / ALB target groups.
        location = /health {
            access_log off;
            expires -1;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /index.html {
            expires -1;
        }

        # Never serve dotfiles (checked before the other regex locations).
        location ~ /\. {
            return 404;
        }

        location ~* \.(?:css|js|svg)$ {
            expires 1h;
            try_files $uri =404;
        }

        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
